[model]
co2 = 280.0
em_land = 0.9800000190734863
em_ocean = 0.9800000190734863
model = "PrimitiveWetModel"

[perturbation]
fac_pert_T = 2.0
fac_pert_q = 0.20000000298023224

[steps]
n_batch = 4
n_gap = 50
n_ic = 10
n_steps_0 = 10
n_steps_inc = 0
n_traj = 100

[target]
em_land = 0.9800000190734863
em_ocean = 0.9800000190734863
scheme = "OneBandLongwave"
transmissivity = "FriersonLongwaveTransmissivity"

[training_time]
start_date = "2000-01-01T00:00:00"
t_spinup = "365 days"
