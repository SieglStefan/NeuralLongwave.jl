[general]
created = 2026-08-14T01:12:13.739Z
experiment = "exp_B_01_width"
julia = "1.10.10"
name = "RNN_w64_s1000"
seed = 1000
sw_vers = "0.21.1+DEV"

[grid]
grid_type = "OctahedralGaussianGrid"
nlayers = 8
trunc = 31

[learning_parameters]
clip_norm = 1.0
eta0 = 0.009999999776482582
eta_decay = 0.800000011920929
weight_decay = 9.999999747378752e-5

[loss]
zscore_name = "zscore_OBLW_default"

    [loss.weights]
    T = 1.0
    olw = 1.0
    slwd = 1.0

[lw_train]
act = "tanh"
def_co2 = 280.0
def_land_em = 0.9800000190734863
def_ocean_em = 0.9800000190734863
inputs = ["T", "sst", "lst", "lf", "lat", "p"]
n_in = 13
n_out = 10
output_form = "DirectOutput"
scheme = "NeuralLW"
width = 64
